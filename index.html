<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- טעינת פונט מהאינטרנט (Google Fonts) כדי שהאתר ייראה אחיד -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <title>owe it - Productivity & Financial Command Center</title>
  </head>
  <body>
    <script>
      (function () {
        var t = localStorage.getItem('mission-flow-theme');
        document.documentElement.setAttribute('data-theme', (t === 'light' || t === 'dark') ? t : 'dark');
      })();
    </script>
    <!-- כאן React "מתלבש" ומצייר את כל האפליקציה -->
    <div id="root"></div>
    <!-- זה הקובץ שמתחיל את האפליקציה (ראה `src/main.tsx`) -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
